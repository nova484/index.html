<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Monitor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <div class="header">
      <div class="app-label">⬡ Weather Monitor</div>
      <div class="header-right">
        <div class="date-label" id="dateLabel"></div>
        <button class="mode-toggle" onclick="toggleDarkMode()" id="modeBtn">🌙 Dark</button>
      </div>
    </div>

    <div class="search-bar">
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="cityInput" placeholder="Search city..." />
      </div>
      <button onclick="getWeather()">Search</button>
    </div>

    <div id="errorMsg" class="error-msg"></div>

    <div id="loadingState" class="loading-state">
      <div class="loading-ring">
        <svg width="120" height="120" viewBox="0 0 120 120">
          <defs>
            <path id="circle" d="M 60,60 m -45,0 a 45,45 0 1,1 90,0 a 45,45 0 1,1 -90,0"/>
          </defs>
          <text font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#888880" letter-spacing="2">
            <textPath href="#circle">
              DIADEM &amp; ELLA ARE AURALESS ✦ DIADEM &amp; ELLA ARE AURALESS ✦
            </textPath>
          </text>
        </svg>
      </div>
    </div>

    <div id="result">

      <div class="main-card">
        <div class="card-top">
          <div>
            <div class="city-label">Current Weather</div>
            <div id="cityName"></div>
            <div id="localTime" class="local-time"></div>
          </div>
          <div id="weatherIcon"></div>
        </div>
        <div class="divider"></div>
        <div class="temp-row">
          <div id="temp"></div>
          <div class="temp-meta">
            <div id="condition"></div>
            <div id="highLow" class="high-low"></div>
          </div>
        </div>
      </div>

      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-icon">💧</div>
          <div class="stat-label">Humidity</div>
          <div class="stat-value" id="humidity">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">💨</div>
          <div class="stat-label">Wind</div>
          <div class="stat-value" id="wind">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">🌡️</div>
          <div class="stat-label">Feels Like</div>
          <div class="stat-value" id="feelsLike">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">👁️</div>
          <div class="stat-label">Visibility</div>
          <div class="stat-value" id="visibility">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">🌅</div>
          <div class="stat-label">Sunrise</div>
          <div class="stat-value" id="sunrise">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">🌇</div>
          <div class="stat-label">Sunset</div>
          <div class="stat-value" id="sunset">-</div>
        </div>
      </div>

      <div class="result-footer">
        <span id="lastUpdated"></span>
        <span>OpenWeatherMap</span>
      </div>

    </div>

    <!-- Speed Test -->
    <div class="speed-section">
      <div class="speed-header">
        <div class="app-label">⬡ Internet Speed Test</div>
      </div>

      <button class="speed-btn" onclick="runSpeedTest()" id="speedBtn">Run Speed Test</button>

      <div id="speedLoading" class="loading-state">
        <div class="loading-ring">
          <svg width="120" height="120" viewBox="0 0 120 120">
            <defs>
              <path id="circle2" d="M 60,60 m -45,0 a 45,45 0 1,1 90,0 a 45,45 0 1,1 -90,0"/>
            </defs>
            <text font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#888880" letter-spacing="2">
              <textPath href="#circle2">
                TESTING YOUR SPEED ✦ PLEASE WAIT ✦ TESTING YOUR SPEED ✦
              </textPath>
            </text>
          </svg>
        </div>
      </div>

      <div id="speedResult" class="speed-result">
        <div class="speed-grid">
          <div class="speed-card">
            <div class="stat-icon">⬇️</div>
            <div class="stat-label">Download</div>
            <div class="stat-value" id="downloadSpeed">-</div>
            <div class="speed-unit">Mbps</div>
          </div>
          <div class="speed-card">
            <div class="stat-icon">⬆️</div>
            <div class="stat-label">Upload</div>
            <div class="stat-value" id="uploadSpeed">-</div>
            <div class="speed-unit">Mbps</div>
          </div>
          <div class="speed-card">
            <div class="stat-icon">📡</div>
            <div class="stat-label">Ping</div>
            <div class="stat-value" id="pingSpeed">-</div>
            <div class="speed-unit">ms</div>
          </div>
          <div class="speed-card">
            <div class="stat-icon">🌐</div>
            <div class="stat-label">Status</div>
            <div class="stat-value" id="connectionStatus">-</div>
          </div>
        </div>
        <div class="speed-footer" id="speedFooter"></div>
      </div>

    </div>

    <div class="signature">
      Made by Raymond — the No.1 Aura Farmer 👑 unlike Diauraless
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
